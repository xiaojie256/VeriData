services:
  # MySQL数据库
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: veri-data-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在根目录 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: veri_data
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - veri-data-network

  # Redis缓存
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: veri-data-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - veri-data-network

  # 后端API服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${BACKEND_NODE_IMAGE:-node:18-alpine}
    container_name: veri-data-backend
    restart: unless-stopped
    command: npm run dev

    # 读取 backend/.env 中的本地私密配置，例如 SMTP_USER、SMTP_PASS
    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development
      TZ: Asia/Shanghai
      DB_TIMEZONE: "+08:00"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?请在根目录 .env 中设置 DB_PASSWORD}
      DB_NAME: veri_data
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?请在根目录 .env 中设置 JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      SESSION_SINGLE_LOGIN_ENABLED: ${SESSION_SINGLE_LOGIN_ENABLED:-true}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      AI_SERVICE_URL: http://ai-service:5000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?请在根目录 .env 中设置 AI_INTERNAL_TOKEN}
      UPLOAD_PATH: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mysql
      - redis
    networks:
      - veri-data-network

  # AI检测服务
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${AI_PYTHON_IMAGE:-python:3.9-slim}
    container_name: veri-data-ai
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      FLASK_ENV: production
      MODEL_PATH: /app/models
      UPLOAD_ROOT: /app/uploads
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?请在根目录 .env 中设置 AI_INTERNAL_TOKEN}
    # 注意：不要把 AI 服务暴露给宿主机。
    # 后端通过 Docker 内部网络访问 http://ai-service:5000。
    # ports:
    #   - "5000:5000"
    volumes:
      - ./ai-service/models:/app/models
      - ./uploads:/app/uploads:ro
      - ./logs:/app/logs
    networks:
      - veri-data-network

  # 前端服务（使用Nginx）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${FRONTEND_NODE_IMAGE:-node:18-alpine}
        NGINX_IMAGE: ${FRONTEND_NGINX_IMAGE:-nginx:alpine}
    container_name: veri-data-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - veri-data-network

networks:
  veri-data-network:
    driver: bridge
